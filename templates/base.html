<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}报关资料差异核对{% endblock %}</title>
  <style>
    :root { --line:#d9dee7; --red-bg:#fdecec; --red:#c0392b; --green:#1e8449; --green-bg:#e9f7ef;
            --amber:#b9770e; --amber-bg:#fef5e7; --blue:#1f618d; --muted:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
           color:#1f2933; background:#f4f6f9; }
    header { background:#1f3a5f; color:#fff; padding:14px 24px; }
    header a { color:#fff; text-decoration:none; font-weight:600; font-size:18px; }
    .wrap { max-width:1080px; margin:22px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px;
            padding:18px 20px; margin-bottom:18px; }
    h2 { margin:0 0 14px; font-size:16px; }
    h3 { margin:0 0 10px; font-size:14px; color:var(--blue); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#eef2f7; font-weight:600; }
    .cell-conflict { background:var(--red-bg); color:var(--red); font-weight:600; }
    .cell-missing { color:var(--muted); font-style:italic; }
    .ver { display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; }
    .b-open { background:var(--red-bg); color:var(--red); }
    .b-claimed { background:var(--amber-bg); color:var(--amber); }
    .b-resolved { background:var(--green-bg); color:var(--green); }
    .b-reconciled { background:var(--green-bg); color:var(--green); border:1px solid var(--green); }
    input,select,textarea { width:100%; padding:7px 9px; border:1px solid var(--line);
            border-radius:5px; font-size:14px; font-family:inherit; }
    textarea { min-height:52px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .grid { display:grid; gap:10px 14px; }
    .g4 { grid-template-columns:repeat(4,1fr); }
    .g2 { grid-template-columns:repeat(2,1fr); }
    button { background:#1f618d; color:#fff; border:0; border-radius:5px; padding:8px 16px;
             font-size:13px; cursor:pointer; }
    button.ghost { background:#fff; color:#1f618d; border:1px solid #1f618d; }
    button.green { background:var(--green); }
    button:disabled { background:#9aa5b1; cursor:not-allowed; }
    form.inline { display:inline; }
    .flash { padding:9px 14px; border-radius:6px; margin-bottom:12px; font-size:14px; }
    .flash.ok { background:var(--green-bg); color:var(--green); }
    .flash.error { background:var(--red-bg); color:var(--red); }
    .muted { color:var(--muted); font-size:12px; }
    .disc { border:1px solid var(--line); border-left:4px solid var(--red); border-radius:6px;
            padding:14px 16px; margin-bottom:14px; background:#fff; }
    .disc.reconciled { border-left-color:var(--green); background:var(--green-bg); }
    .disc.resolved { border-left-color:#9aa5b1; background:#f7f9fb; }
    .disc .vals { margin:8px 0; font-size:13px; }
    .disc .vals table { margin-top:6px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; }
    .actions .grow { flex:1; min-width:160px; }
    ul.logs { list-style:none; padding:0; margin:0; font-size:13px; max-height:340px; overflow:auto; }
    ul.logs li { padding:6px 0; border-bottom:1px dashed var(--line); }
    .logt { color:var(--muted); font-size:11px; margin-right:8px; }
    .meta { display:flex; gap:26px; flex-wrap:wrap; font-size:13px; margin-bottom:4px; }
    .meta b { color:#1f2933; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">报关资料差异核对系统</a></header>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
